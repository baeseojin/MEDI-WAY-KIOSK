name: mediway
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mediway
      POSTGRES_USER: mediway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediway -d mediway"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7.4
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres-data:
