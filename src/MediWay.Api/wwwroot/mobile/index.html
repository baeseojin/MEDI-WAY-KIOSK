<!doctype html>
<html lang="ko">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="referrer" content="no-referrer"><title>MEDI-WAY · 모바일 길 안내</title>
 <link rel="stylesheet" href="styles.css"><script src="app.js" defer></script>
</head>
<body>
 <main>
  <header><p class="brand">MEDI-WAY</p><h1>진료실 길 안내</h1><p>가상 병원 시연</p></header>
  <section class="summary" aria-live="polite"><h2 id="destination">안내를 확인하고 있어요</h2><p id="ticket"></p><p id="distance"></p><p id="expires"></p></section>
  <p id="message" role="status">잠시만 기다려 주세요.</p>
  <section id="guide" hidden>
   <p id="floor-caption"></p>
   <div class="toolbar"><button id="zoom-in" type="button" aria-label="지도 확대">확대 +</button><button id="zoom-out" type="button" aria-label="지도 축소">축소 −</button><button id="fit" type="button">전체 보기</button><button id="next-floor" type="button" hidden>다음 층 지도</button></div>
   <div class="map" id="map" data-zoom="1"><svg id="drawing" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="진료실 이동 경로"></svg></div>
   <p class="legend">청록 선: 이동 경로 · 주황 원: 목적지 · 빨간 점선: 폐쇄 통로</p>
   <p id="steps"></p>
  </section>
  <button id="refresh" class="primary" type="button">경로 다시 확인</button>
  <footer>도움이 필요하면 안내 데스크에 문의해 주세요.<br>현재 위치는 QR을 발급한 키오스크 기준입니다.</footer>
  <noscript>이 안내를 보려면 브라우저의 자바스크립트 기능이 필요합니다.</noscript>
 </main>
</body>
</html>
